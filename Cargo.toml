[package]
name = "herdr-pet"
version = "0.2.0"
edition = "2021"
description = "Companion V-Pet for Herdr — mirrors your coding agent"
license = "AGPL-3.0-or-later"
repository = "https://github.com/allmight-ai/herdr-pet"

[[bin]]
name = "herdr-pet"
path = "src/main.rs"

[lib]
name = "herdr_pet"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
unicode-width = "0.2"
