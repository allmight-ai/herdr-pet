id = "fredericotmello.herdr-pet"
name = "Herdr Pet"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Companion V-Pet — coleção forjada por mérito (raridade derivada do seu GitHub)."
platforms = ["linux", "macos"]

# Herdr compila o Rust no install (a partir do GitHub). Gera ./target/release/herdr-pet.
[[build]]
command = ["cargo", "build", "--release"]

# Ação de demonstração (Fase 1). Comandos de gameplay (feed/play/sleep/reborn) entram depois.
[[actions]]
id = "status"
title = "Pet status"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "status"]

# Casinha LCD ao vivo (stdout/ANSI — sem protocolo gráfico, conforme a doc do Herdr).
[[panes]]
id = "lcd"
title = "Pet"
placement = "split"
command = ["./target/release/herdr-pet", "watch"]
