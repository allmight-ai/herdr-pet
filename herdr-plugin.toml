id = "allmight-ai.herdr-pet"
name = "Herdr Pet"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Companion V-Pet — espelha o status e a tarefa do seu agente de código."
platforms = ["linux", "macos"]

# Install: compila + grava atalho/PATH automaticamente (herdr-pet setup).
[[build]]
command = ["sh", "scripts/build.sh"]

# Toda subida do server: re-garante atalho/shim (ex.: path mudou no update do plugin).
[[startup]]
command = ["./target/release/herdr-pet", "setup", "--quiet"]

[[actions]]
id = "status"
title = "Pet status"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "status"]

[[actions]]
id = "open"
title = "Pet: toggle (abre/fecha)"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "open"]

[[actions]]
id = "setup"
title = "Pet: reaplicar atalho e PATH"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "setup"]

[[panes]]
id = "lcd"
title = "Pet"
placement = "split"
command = ["./target/release/herdr-pet", "watch"]
