id = "allmight-ai.herdr-pet"
name = "Herdr Pet"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Companion V-Pet — espelha o status e a tarefa do seu agente de código."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "status"
title = "Pet status"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "status"]

[[actions]]
id = "open"
title = "Pet: toggle (abre/fecha)"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "open"]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "allmight-ai.herdr-pet.open"
description = "Pet: toggle (abre/fecha)"

[[panes]]
id = "lcd"
title = "Pet"
placement = "split"
command = ["./target/release/herdr-pet", "watch"]
